<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boston Renal - Kidney Care</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/x-icon" href="/images/fav.png">
    <script src="js/loadComponents.js" defer></script>
</head>
<body>

    <div id="header"></div> 
    <!-- Carousel -->
     <!-- Hero Slider -->
     <section class="hero-sectionz" style="background-image: url(images/img/contactus.png);">
        <div class="hero-overlayz"></div>
        <div class="hero-contenty container">
            <h1 class="hero-titlez mb-4">Contact Us</h1>
        </div>
    </section>

    <section class="contact-section">
        <div class="container">
            <div class="row">
                <div class="col-lg-6">
                    <div class="p-4 bg-white rounded-4 shadow-sm">
                        <h2 class="title">Get In Touch</h2>
                        <p class="subtitle">You can reach us anytime</p>
                        
                        <form>
                            <div class="row">
                                <div class="col-md-6">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" class="form-control" placeholder="Your Name">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Your Number</label>
                                    <input type="tel" class="form-control" placeholder="Your Number">
                                </div>
                            </div>
                            
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" placeholder="Your Email">
                            
                            <label class="form-label">Messages</label>
                            <textarea class="form-control" placeholder="Leave Us Message"></textarea>
                            
                            <button type="submit" class="cta-button">Book Appointment</button>
                        </form>
                    </div>
                </div>
                
                <div class="col-lg-6">
                    <div class="text-center mb-4">
                        <img src="images/Contact us.png" alt="Contact Us" class="img-fluid rounded-4">
                    </div>
                    
                    <div class="contact-card col-12">
                        <div class="row">
                            <div class="contact-info col-lg-7">
                                <div class="contact-icon">
                                    <i class="bi bi-envelope-fill"></i>
                                </div>
                                <div class="contact-text">
                                    <span class="contact-label">Email</span>
                                    <span class="contact-value"><a href="mailto:connect@bostonrenal.com">connect@bostonrenal.com</a></span>
                                </div>
                            </div>
                            
                            <div class="contact-info col-lg-5">
                                <div class="contact-icon">
                                    <i class="bi bi-telephone-fill"></i>
                                </div>
                                <div class="contact-text">
                                    <span class="contact-label">Ph Number</span>
                                    <span class="contact-value"><a href="tel:+1 612 8684 777">+1 612 8684 777</a></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer"></div> 

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.faq-item').forEach(item => {
        item.addEventListener('click', () => {
            // Close all other items
            document.querySelectorAll('.faq-item').forEach(otherItem => {
                if (otherItem !== item && otherItem.classList.contains('active')) {
                    otherItem.classList.remove('active');
                }
            });
            
            // Toggle current item
            item.classList.toggle('active');
        });
    });
</script>

<script>
    window.addEventListener("scroll", function () {
        var navbar = document.querySelector(".navbar");
        if (window.scrollY > 50) {
            navbar.classList.add("fixed-nav");
        } else {
            navbar.classList.remove("fixed-nav");
        }
    });
</script>
</body>
</html>
